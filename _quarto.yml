project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - about.qmd
    - publications.qmd
    - presentations.qmd
    - seminars.qmd
    - notes.qmd
    - privacy.qmd
    - notes/
    - en/index.qmd
    - en/about.qmd
    - en/publications.qmd
    - en/presentations.qmd
    - en/seminars.qmd
    - en/notes.qmd
    - en/privacy.qmd
    - en/notes/
  post-render:
    - python3 scripts/localize-navigation.py
  resources:
    - .nojekyll
    - papers/

lang: ja

website:
  title: "Website of Kengo Shinoda"
  navbar:
    left:
      - href: index.qmd
        text: ホーム
      - href: about.qmd
        text: プロフィール
      - href: publications.qmd
        text: 業績
      - href: presentations.qmd
        text: 講演
      - href: seminars.qmd
        text: セミナー歴
      - href: notes.qmd
        text: ノート
    right:
      - href: en/index.qmd
        text: English
  page-footer:
    center: "© 2026 Kengo Shinoda"
    right:
      - text: "Privacy"
        href: privacy.qmd
  cookie-consent:
    type: express
    style: simple
    palette: light
    policy-url: /privacy.html
  google-analytics:
    tracking-id: "G-N84KQXQ6QN"
    anonymize-ip: true

format:
  html:
    theme: litera
    css: styles.css
    toc: true
    link-external-newwindow: true
